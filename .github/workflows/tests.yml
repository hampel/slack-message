name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ""
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      # The floor corner. A local install always has the newest release allowed
      # by each constraint, so a constraint that is too generous passes here
      # forever and fails only for whoever installs the package next.
      - run: composer update --prefer-lowest --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      # The only job that resolves the toolchain low, so the only one that holds the
      # phpstan/phpstan constraint to the phpVersion max its configs declare. Naming a PHP
      # version the installed PHPStan predates is a configuration error, not a weaker analysis:
      # the run dies before reading any code. Pint is left out - its rule set moves between
      # patches, so the oldest rejects what the newest accepts.
      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/phpstan analyse --configuration=phpstan-ceiling.neon --no-progress

  guzzle7:
    name: Guzzle 7
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      # A fresh install resolves Guzzle 8, which the matrix above therefore covers. This is the
      # other side: XenForo 2.x is on Guzzle 7, and it is the reason this package exists. Named
      # rather than left to --prefer-lowest, so that raising a floor later cannot quietly drop it.
      - run: composer update --with="guzzlehttp/guzzle:^7.8" --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  no-dev:
    name: Production install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none
          # PHPStan is a dev dependency, so the install below deletes it. This is a
          # standalone binary outside every vendor directory, which is the only place it
          # can run from without lending src/ somebody else's dependencies.
          tools: phpstan

      # What a consumer actually receives. Guzzle is only a suggestion, so this
      # is the one job with no HTTP client present at all: it proves src/ needs
      # nothing beyond what composer.json requires, and it is the only place the
      # missing-factory path can be reached.
      - run: composer install --no-dev --prefer-dist --no-progress

      - run: php tests/production-install.php

      # The script above proves the paths it executes. This covers the rest: a class
      # supplied by a dev dependency resolves in every other job and fatals for the
      # consumer. -c is not optional - without it PHPStan discovers phpstan.neon, which
      # is the config being escaped from.
      - run: phpstan analyse -c phpstan-nodev.neon --autoload-file=vendor/autoload.php --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress

      # A range reports only what is an error across the whole of it, so a deprecation
      # introduced above the floor does not appear. This pins the analysis at the ceiling.
      - run: vendor/bin/phpstan analyse --configuration=phpstan-ceiling.neon --no-progress
